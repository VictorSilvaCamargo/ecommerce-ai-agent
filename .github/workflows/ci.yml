name: CI Pipeline

on:
  push:
    branches: [ master, main, 'fase-*' ]
  pull_request:
    branches: [ master, main ]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev

      - name: Ruff Lint & Format Check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type Check (mypy strict)
        run: |
          uv run mypy --strict src

      - name: Architecture Layer Contracts (import-linter)
        run: |
          uv run lint-imports

      - name: Run Test Suite with Coverage
        run: |
          uv run pytest --cov=src/atendente --cov-fail-under=85
